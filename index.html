<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резюме - Павел Карякин</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            transition: background-color 0.6s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 3px solid #3b82f6;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 20px;
        }

        .photo {
            display: block;
            width: 180px;
            margin: 20px auto;
            border-radius: 15px;
            border: 4px solid #2563eb;
        }

        h1 {
            font-size: 2.8rem;
            margin: 10px 0 5px;
            color: #1e293b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #64748b;
            font-style: italic;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #3b82f6;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #randomBgBtn {
            background-color: #10b981;
        }

        #randomBgBtn:hover {
            background-color: #059669;
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.4);
        }

        section h2 {
            font-size: 1.8rem;
            color: #334155;
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 5px solid #3b82f6;
            padding-left: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p, li {
            font-size: 1.1rem;
            color: #475569;
        }

        ul {
            list-style-type: square;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }      
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="https://stankin.ru/bitrix/templates/stankin/images/stankin-logo-main-color-ru-rgb!-01.png" class="photo">
            <h1>Павел <span id="surname">Карякин</span></h1>
        </header>

        <div class="controls">
            <input type="text" id="surnameInput" placeholder="Введите новую фамилию...">
            <button id="changeSurnameBtn">Изменить фамилию</button>
            <button id="randomBgBtn">Случайный фон</button>
        </div>

        <section class="info">
            <h2> Обо мне</h2>
            <p>Увлечен веб-разработкой и изучением современных технологий. Стремлюсь создавать удобные, красивые и отзывчивые интерфейсы. Быстро адаптируюсь к новым задачам и активно работаю над повышением квалификации.</p>

        </section>
    </div>

    <script>
        const surnameSpan = document.getElementById('surname');
        const surnameInput = document.getElementById('surnameInput');
        const changeBtn = document.getElementById('changeSurnameBtn');

        changeBtn.addEventListener('click', function() {
            const newValue = surnameInput.value.trim();
            
            if (newValue !== "") {
                surnameSpan.textContent = newValue;
                surnameInput.value = "";
                alert('Фамилия успешно изменена!');

            } else {
                alert('Пожалуйста, введите фамилию в поле ввода.');
                surnameInput.focus();
            }
        });

        const randomBgBtn = document.getElementById('randomBgBtn');

        randomBgBtn.addEventListener('click', function() {
            const randomColor = '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0');
            document.body.style.backgroundColor = randomColor;
        });
    </script>

</body>
</html>
