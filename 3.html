<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Индивидуалка 3</title>
</head>
<body>
    <script>
        let age;
        let answer = false;

        while (answer === false) {
            age = prompt("Сколько вам лет?");

            if (age === null) {
                continue;
            }

            answer = confirm("Вам точно " + age + " лет?");
        }

        alert("Ваш возраст: " + age);
    </script>
</body>
</html>
