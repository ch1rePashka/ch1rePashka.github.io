<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Индивидуалка 1</title>
</head>
<body>
    <script>
        function min(a, b) {
            if (a < b) {
                return a;
            } else {
                return b;
            }
        }

        let num1 = 12;
        let num2 = 44;

        alert("минимум из " + num1 + " и " + num2 + " = " + min(num1, num2));
    </script>
</body>
</html>
